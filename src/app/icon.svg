<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Bhim Shila: the boulder, the sacred threads, and the water going around
       it. Kept deliberately coarse — this renders at 16px in a browser tab,
       where the scene from the brand sheet would be an unreadable smudge. See
       src/components/Logo.tsx for the same mark and why it drops what it drops. -->
  <rect width="64" height="64" rx="14" fill="#0a0e16"/>

  <!-- water, parting -->
  <g fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M6 41 C15 41 19 46 21 53" stroke="#3f92e8" stroke-width="3"/>
    <path d="M58 41 C49 41 45 46 43 53" stroke="#3f92e8" stroke-width="3"/>
    <path d="M8 33 C14 33 17 35 19 39" stroke="#7fb6f0" stroke-width="2" opacity="0.7"/>
    <path d="M56 33 C50 33 47 35 45 39" stroke="#7fb6f0" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- the boulder -->
  <path d="M14 53 C14 34 22 23 32 23 C42 23 50 34 50 53 Z"
        fill="#a79d92" stroke="#403a34" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M20 41 C22 32 26 26 32 25 C27 29 24 35 22 44 Z" fill="#bcb3a8"/>

  <!-- the threads -->
  <g fill="none" stroke-width="2.4" stroke-linecap="round">
    <path d="M22 28 C19 35 19 45 22 53" stroke="#c0392b"/>
    <path d="M27 25 C24 33 24 45 27 53" stroke="#e07b2c"/>
    <path d="M32 23.5 C30 32 30 45 32 53" stroke="#c0392b"/>
  </g>
</svg>
